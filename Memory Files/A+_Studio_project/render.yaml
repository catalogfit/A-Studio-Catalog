# ===== A+ Studio backend — Render blueprint =====
# Render's own Node runtime has no ffmpeg, and /api/compose shells out to it, so this is a
# Docker service built from the Dockerfile at the repo root.
#
# To deploy: Render dashboard -> New -> Blueprint -> pick this repo. Render reads this file,
# creates the service, and prompts for the secrets marked `sync: false`.
#
# After the first deploy, add the live callback to the Google Cloud OAuth client's
# "Authorised redirect URIs":   https://<your-service>.onrender.com/auth/callback
# and set GOOGLE_REDIRECT_URI below to the same string.

services:
  - type: web
    name: aplus-studio-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Measured: a 1572x5700 / 24-frame composite completes in ~3 s on 1 GB and ~9 s on 512 MB.
    # `starter` (512 MB) works; move to `standard` if compose jobs get long or concurrent.
    plan: starter
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # Render generates this once and keeps it stable across deploys — which is exactly what
      # makes Google sign-ins survive a redeploy. Changing it signs everyone out (that is the
      # revocation lever). Never print it, never copy it into the plugin.
      - key: SESSION_SECRET
        generateValue: true

      # Secrets — entered in the Render dashboard, never committed.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Must exactly match an "Authorised redirect URI" on the OAuth client.
      - key: GOOGLE_REDIRECT_URI
        sync: false

      # Optional — for the AI-assisted template labelling in docs/add-to-template-plan.md.
      # Not implemented yet; env plumbing only. It lives here and NEVER in the plugin.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5

      - key: NODE_ENV
        value: production
      # ffmpeg scratch space for a single compose job; cleaned up after every request.
      - key: APLUS_TMP_DIR
        value: /tmp/aplus
      - key: COMPOSE_TIMEOUT_MS
        value: "300000"

      # NOTE: SESSION_DIR is deliberately NOT set. Sessions are sealed tokens held by the plugin
      # (backend/session.js), so the service is stateless and needs no persistent disk. If you
      # ever do attach one, mount it and set SESSION_DIR to the mount path.
